name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0

jobs:
  ci:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --- @swifty.js/glob-wasm (must build first: swifty's typecheck/tests
      # resolve it from dist/, and swifty's tsup build copies release.wasm) ---

      - name: Test glob-wasm
        run: pnpm --filter @swifty.js/glob-wasm test

      - name: Build glob-wasm
        run: pnpm --filter @swifty.js/glob-wasm build

      # --- @swifty.js/swifty ---

      - name: Typecheck swifty
        run: pnpm --filter @swifty.js/swifty typecheck

      # Build before test: tests/library-entry.test.ts asserts on dist/ artifacts
      # (bin shebang, library boundary), so a fresh runner must have them.
      - name: Build swifty
        run: pnpm --filter @swifty.js/swifty build

      - name: Test swifty
        run: pnpm --filter @swifty.js/swifty test

      - name: Lint swifty
        run: pnpm --filter @swifty.js/swifty lint

      - name: Build swifty frontend
        run: pnpm --filter @swifty.js/swifty build:fe

      # --- @swifty.js/mcp ---

      - name: Typecheck mcp
        run: pnpm --filter @swifty.js/mcp typecheck

      - name: Test mcp
        run: pnpm --filter @swifty.js/mcp test

      - name: Build mcp
        run: pnpm --filter @swifty.js/mcp build

      - name: Build mcp frontend
        run: pnpm --filter @swifty.js/mcp build:fe

  # --- Docs site (apps/docs) → GitHub Pages ---
  # Publishes on every push to main, after the test/build job passes.
  deploy-docs:
    name: Deploy Docs to GitHub Pages
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm --filter docs build
        env:
          # Project pages live under /<repo>/; swap DOCS_BASE for a custom domain.
          DOCS_BASE: /${{ github.event.repository.name }}/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
