# Swifty project-level configuration
# See src/config/config.ts for schema details.

# Permission mode: "default" | "acceptEdits" | "plan" | "bypassPermissions"
permission_mode: bypassPermissions

# LLM providers — at least one is required.
# api_key is intentionally left empty; it falls back to the ANTHROPIC_API_KEY
# (or OPENAI_API_KEY) environment variable at runtime.
providers:
  - name: ali-openai
    protocol: openai-compat
    base_url: ""  # REQUIRED, string — API endpoint
    model: "qwen3.7-flash"
    api_key: ""                # optional, string, default: falls back to env var
    thinking: true                           # optional, boolean, default: false — enable extended thinking
    context_window: 1000000                  # optional, number, default: built-in lookup by model name
                                             #   (claude -> 200000, gpt-4.1/1m -> 1000000, else 128000)
    max_output_tokens: 128000               # optional, number, default: 8192 (64000 when thinking: true)
  - name: ds-anthropic
    protocol: anthropic
    base_url: https://api.deepseek.com/anthropic  # REQUIRED, string — API endpoint
    model: "deepseek-v4-flash"
    api_key: "sk-"                # optional, string, default: falls back to env var
    thinking: true                           # optional, boolean, default: false — enable extended thinking
    context_window: 1000000                  # optional, number, default: built-in lookup by model name
                                             #   (claude -> 200000, gpt-4.1/1m -> 1000000, else 128000)
    max_output_tokens: 12800               # optional, number, default: 8192 (64000 when thinking: true)
  - name: ds-openai
    protocol: openai
    base_url: https://api.deepseek.com      # REQUIRED, string — API endpoint
    model: "deepseek-v4-flash"
    api_key: "sk-"                # optional, string, default: falls back to env var
    thinking: true                           # optional, boolean, default: false — enable extended thinking
    context_window: 1000000                  # optional, number, default: built-in lookup by model name
                                             #   (claude -> 200000, gpt-4.1/1m -> 1000000, else 128000)
    max_output_tokens: 128000               # optional, number, default: 8192 (64000 when thinking: true)

# MCP servers — optional, empty by default.
# MCP servers — optional, empty by default.
mcp_servers:
  - name: "swifty-mcp"
    command: pnpm
    args: ["--filter", "@swifty.js/mcp", "exec", "node", "dist/main.js"]
    env:
      EMBEDDING_MODEL: "text-embedding-v4"
      EMBEDDING_PROTOCOL: "openai" # optional, default "openai" (the only supported value for now)
      EMBEDDING_API_KEY: ""
      EMBEDDING_BASE_URL: ""
      REDIS_URL: "redis://localhost:6379"
      REDIS_INDEX_NAME: 'idx:swifty'
      REDIS_KEY_PREFIX: "swifty:"

# Hooks — optional, empty by default.
hooks: []
  # Example: lint after EditFile
  # - id: lint-on-edit
  #   event: post_tool_use
  #   condition: 'tool == "EditFile"'
  #   action:
  #     type: command
  #     command: npx eslint --fix "$SWIFTY_FILE_PATH"
  #   on_error: ignore
